<svg width="680" height="440" viewBox="0 0 680 440" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Stakeholder power/interest matrix</title>
<desc>Shows a two by two matrix with power on the vertical axis and interest on the horizontal axis, illustrating four stakeholder management strategies: manage closely for high power high interest, keep satisfied for high power low interest, keep informed for low power high interest, and minimal effort for low power low interest.</desc>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#E6E6E6;}
.axis{font-size:12px;font-weight:600;fill:#F5F5F5;}
.lbl{font-size:12px;font-weight:600;fill:#F5F5F5;}
.sub{font-size:10px;fill:#C9C9C9;}
.q1{fill:#3A1E1E;stroke:#D97070;stroke-width:1;}
.q2{fill:#3A2A10;stroke:#E0A33D;stroke-width:1;}
.q3{fill:#3A2A10;stroke:#E0A33D;stroke-width:1;}
.q4{fill:#173829;stroke:#4CAF8C;stroke-width:1;}
</style>
<rect x="0" y="0" width="680" height="440" fill="#0D1117"/>

<text class="axis" x="360" y="26" text-anchor="middle">Stakeholder Power vs Interest</text>

<text class="axis" x="30" y="90" text-anchor="middle" transform="rotate(-90 30 90)">High Power</text>
<text class="axis" x="30" y="330" text-anchor="middle" transform="rotate(-90 30 330)">Low Power</text>
<text class="axis" x="230" y="410" text-anchor="middle">Low Interest</text>
<text class="axis" x="500" y="410" text-anchor="middle">High Interest</text>

<rect class="q2" x="70" y="55" width="290" height="150" rx="6"/>
<text class="lbl" x="215" y="85" text-anchor="middle">Keep Satisfied</text>
<text class="sub" x="215" y="115" text-anchor="middle">Senior leadership —</text>
<text class="sub" x="215" y="130" text-anchor="middle">not tracking daily detail</text>
<text class="sub" x="215" y="158" text-anchor="middle">Concise, infrequent updates,</text>
<text class="sub" x="215" y="173" text-anchor="middle">focused on outcomes not process</text>

<rect class="q1" x="370" y="55" width="290" height="150" rx="6"/>
<text class="lbl" x="515" y="85" text-anchor="middle">Manage Closely</text>
<text class="sub" x="515" y="115" text-anchor="middle">Product owner,</text>
<text class="sub" x="515" y="130" text-anchor="middle">engineering lead</text>
<text class="sub" x="515" y="158" text-anchor="middle">Regular direct communication,</text>
<text class="sub" x="515" y="173" text-anchor="middle">involve in key decisions</text>

<rect class="q4" x="70" y="215" width="290" height="150" rx="6"/>
<text class="lbl" x="215" y="245" text-anchor="middle">Minimal Effort</text>
<text class="sub" x="215" y="275" text-anchor="middle">Stakeholders with little</text>
<text class="sub" x="215" y="290" text-anchor="middle">stake and little influence</text>
<text class="sub" x="215" y="318" text-anchor="middle">Standard broadcast</text>
<text class="sub" x="215" y="333" text-anchor="middle">updates are sufficient</text>

<rect class="q3" x="370" y="215" width="290" height="150" rx="6"/>
<text class="lbl" x="515" y="245" text-anchor="middle">Keep Informed</text>
<text class="sub" x="515" y="275" text-anchor="middle">Engineers curious about</text>
<text class="sub" x="515" y="290" text-anchor="middle">coverage in their area</text>
<text class="sub" x="515" y="318" text-anchor="middle">Useful allies — keep them</text>
<text class="sub" x="515" y="333" text-anchor="middle">informed, no decision role needed</text>
</svg>
