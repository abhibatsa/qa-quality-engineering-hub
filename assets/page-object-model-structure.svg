<svg width="700" height="300" viewBox="0 0 700 300" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Page Object Model structure</title>
<desc>Shows a test file calling a LoginPage object's login method, which internally handles three locators and interactions with the username field, password field, and submit button, illustrating that the test file never touches locators directly.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#9CA3AF" stroke-width="1.5"/></marker></defs>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#E6E6E6;}
.lbl{font-size:12px;font-weight:600;fill:#F5F5F5;}
.sub{font-size:10px;fill:#C9C9C9;}
.code{font-family:monospace;font-size:10px;fill:#D0D0D0;}
.test{fill:#241E3D;stroke:#8C7DE0;stroke-width:1;}
.page{fill:#173829;stroke:#4CAF8C;stroke-width:1;}
.elem{fill:#3A2A10;stroke:#E0A33D;stroke-width:1;}
line{stroke:#9CA3AF;stroke-width:1.3;marker-end:url(#a);}
</style>
<rect x="0" y="0" width="700" height="300" fill="#0D1117"/>

<rect class="test" x="30" y="40" width="220" height="80" rx="8"/>
<text class="lbl" x="140" y="62" text-anchor="middle">test_valid_login()</text>
<text class="code" x="45" y="85">login_page.login(</text>
<text class="code" x="45" y="99">  user, pass)</text>
<text class="sub" x="140" y="115" text-anchor="middle">no locators here</text>

<line x1="250" y1="80" x2="320" y2="80"/>

<rect class="page" x="320" y="30" width="220" height="100" rx="8"/>
<text class="lbl" x="430" y="52" text-anchor="middle">LoginPage</text>
<text class="code" x="335" y="75">def login(user, pass):</text>
<text class="code" x="345" y="90">  fill(username)</text>
<text class="code" x="345" y="103">  fill(password)</text>
<text class="code" x="345" y="116">  click(submit)</text>

<line x1="540" y1="55" x2="600" y2="55"/>
<rect class="elem" x="600" y="35" width="90" height="34" rx="6"/>
<text class="sub" x="645" y="56" text-anchor="middle">#username</text>

<line x1="540" y1="80" x2="600" y2="80"/>
<rect class="elem" x="600" y="63" width="90" height="34" rx="6"/>
<text class="sub" x="645" y="84" text-anchor="middle">#password</text>

<line x1="540" y1="105" x2="600" y2="105"/>
<rect class="elem" x="600" y="91" width="90" height="34" rx="6"/>
<text class="sub" x="645" y="112" text-anchor="middle">#submit</text>

<text class="sub" x="350" y="175" text-anchor="middle">If the username field's locator changes tomorrow, exactly one file changes: LoginPage.</text>
<text class="sub" x="350" y="192" text-anchor="middle">Every test using login() keeps working, untouched — that's the entire value of this pattern.</text>
</svg>
