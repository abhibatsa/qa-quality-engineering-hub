<svg width="700" height="220" viewBox="0 0 700 220" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Defect mapping chain</title>
<desc>Shows the chain linking a requirement to the test case that verifies it, and the test case to a defect found while executing it, illustrating how defect density per requirement becomes visible once this chain is consistently linked.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#9CA3AF" stroke-width="1.5"/></marker></defs>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#E6E6E6;}
.lbl{font-size:12px;font-weight:600;fill:#F5F5F5;}
.sub{font-size:10px;fill:#C9C9C9;}
.req{fill:#241E3D;stroke:#8C7DE0;stroke-width:1;}
.tc{fill:#173829;stroke:#4CAF8C;stroke-width:1;}
.def{fill:#3A1E1E;stroke:#D97070;stroke-width:1;}
line{stroke:#9CA3AF;stroke-width:1.3;marker-end:url(#a);}
</style>
<rect x="0" y="0" width="700" height="220" fill="#0D1117"/>

<rect class="req" x="30" y="70" width="180" height="60" rx="8"/>
<text class="lbl" x="120" y="93" text-anchor="middle">REQ-103</text>
<text class="sub" x="120" y="112" text-anchor="middle">Account locks after</text>
<text class="sub" x="120" y="124" text-anchor="middle">5 failed attempts</text>

<line x1="210" y1="100" x2="270" y2="100"/>

<rect class="tc" x="270" y="70" width="180" height="60" rx="8"/>
<text class="lbl" x="360" y="93" text-anchor="middle">TC-098</text>
<text class="sub" x="360" y="112" text-anchor="middle">Verify lockout after</text>
<text class="sub" x="360" y="124" text-anchor="middle">5th failed attempt</text>

<line x1="450" y1="100" x2="510" y2="100"/>

<rect class="def" x="510" y="70" width="180" height="60" rx="8"/>
<text class="lbl" x="600" y="93" text-anchor="middle">BUG-341</text>
<text class="sub" x="600" y="112" text-anchor="middle">Lockout triggers after</text>
<text class="sub" x="600" y="124" text-anchor="middle">6 attempts, not 5</text>

<text class="sub" x="350" y="170" text-anchor="middle">Requirement → Test Case → Defect, linked consistently — this is what makes</text>
<text class="sub" x="350" y="188" text-anchor="middle">"which requirements had the most defects" an answerable question, not a guess.</text>
</svg>
