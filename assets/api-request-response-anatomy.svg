<svg width="760" height="320" viewBox="0 0 760 320" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Anatomy of an API request and response</title>
<desc>Shows an API request with its method, endpoint, headers, and body on the left, and the corresponding response with status code, headers, and response body on the right, labeling what to verify in each part: correct status code, correct schema and types, and relevant headers like content-type and rate limits.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#9CA3AF" stroke-width="1.5"/></marker></defs>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#E6E6E6;}
.lbl{font-size:12px;font-weight:700;fill:#F5F5F5;}
.code{font-family:monospace;font-size:9.5px;fill:#D0D0D0;}
.sub{font-size:9px;fill:#E0A33D;}
.box{stroke-width:1;fill:#161B22;}
.req{stroke:#8C7DE0;}
.res{stroke:#4CAF8C;}
line{stroke:#9CA3AF;stroke-width:1.3;marker-end:url(#a);}
</style>
<rect x="0" y="0" width="760" height="320" fill="#0D1117"/>

<rect class="box req" x="20" y="30" width="330" height="220" rx="8"/>
<text class="lbl" x="185" y="55" text-anchor="middle">Request</text>
<text class="code" x="35" y="80">POST /api/orders</text>
<text class="sub" x="220" y="80">← method + endpoint</text>
<text class="code" x="35" y="105">Headers:</text>
<text class="code" x="45" y="122">Authorization: Bearer ***</text>
<text class="code" x="45" y="137">Content-Type: application/json</text>
<text class="sub" x="270" y="130" font-size="8.5">← check auth edge cases</text>
<text class="code" x="35" y="165">Body:</text>
<text class="code" x="45" y="182">{ "sku": "ABC123",</text>
<text class="code" x="45" y="197">  "qty": 2 }</text>
<text class="sub" x="225" y="190" font-size="8.5">← boundary/invalid input</text>

<line x1="350" y1="140" x2="390" y2="140"/>

<rect class="box res" x="390" y="30" width="330" height="220" rx="8"/>
<text class="lbl" x="555" y="55" text-anchor="middle">Response</text>
<text class="code" x="405" y="80">Status: 201 Created</text>
<text class="sub" x="600" y="80">← correct code, not just 2xx</text>
<text class="code" x="405" y="105">Headers:</text>
<text class="code" x="415" y="122">Content-Type: application/json</text>
<text class="code" x="415" y="137">X-RateLimit-Remaining: 98</text>
<text class="sub" x="650" y="130">← easy to overlook</text>
<text class="code" x="405" y="165">Body:</text>
<text class="code" x="415" y="182">{ "orderId": "ord_9k2",</text>
<text class="code" x="415" y="197">  "status": "pending" }</text>
<text class="sub" x="610" y="190" font-size="8.5">← schema, not just values</text>

<text class="sub" x="370" y="285" text-anchor="middle" fill="#C9C9C9">"Did it return 200" checks almost nothing — status code correctness, schema, headers, and</text>
<text class="sub" x="370" y="302" text-anchor="middle" fill="#C9C9C9">idempotency are each a separate thing worth verifying deliberately.</text>
</svg>
