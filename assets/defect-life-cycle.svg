<svg width="760" height="340" viewBox="0 0 760 340" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Defect life cycle states</title>
<desc>Shows the defect life cycle: New transitions to Assigned, then In Progress, then Fixed, then Retest. From Retest, a passing verification leads to Closed, while a failing verification leads back to Reopened, which returns to In Progress. New can also transition directly to Rejected as a valid outcome.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#9CA3AF" stroke-width="1.5"/></marker></defs>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#E6E6E6;}
.lbl{font-size:11.5px;font-weight:600;fill:#F5F5F5;}
.sub{font-size:9px;fill:#C9C9C9;}
.box{fill:#241E3D;stroke:#8C7DE0;stroke-width:1;}
.closed{fill:#173829;stroke:#4CAF8C;stroke-width:1;}
.reopen{fill:#3A1E1E;stroke:#D97070;stroke-width:1;}
.reject{fill:#3A2A10;stroke:#E0A33D;stroke-width:1;}
line{stroke:#9CA3AF;stroke-width:1.3;marker-end:url(#a);}
</style>
<rect x="0" y="0" width="760" height="340" fill="#0D1117"/>

<rect class="box" x="20" y="40" width="100" height="42" rx="8"/>
<text class="lbl" x="70" y="65" text-anchor="middle">New</text>
<line x1="120" y1="61" x2="170" y2="61"/>

<rect class="box" x="170" y="40" width="100" height="42" rx="8"/>
<text class="lbl" x="220" y="65" text-anchor="middle">Assigned</text>
<line x1="270" y1="61" x2="320" y2="61"/>

<rect class="box" x="320" y="40" width="110" height="42" rx="8"/>
<text class="lbl" x="375" y="65" text-anchor="middle">In Progress</text>
<line x1="430" y1="61" x2="480" y2="61"/>

<rect class="box" x="480" y="40" width="100" height="42" rx="8"/>
<text class="lbl" x="530" y="65" text-anchor="middle">Fixed</text>
<line x1="580" y1="61" x2="630" y2="61"/>

<rect class="box" x="630" y="40" width="110" height="42" rx="8"/>
<text class="lbl" x="685" y="65" text-anchor="middle">Retest</text>

<line x1="685" y1="82" x2="685" y2="150"/>
<line x1="685" y1="150" x2="600" y2="150"/>
<rect class="closed" x="480" y="128" width="120" height="44" rx="8"/>
<text class="lbl" x="540" y="150" text-anchor="middle">Closed</text>
<text class="sub" x="655" y="140">pass</text>

<line x1="685" y1="150" x2="685" y2="220"/>
<rect class="reopen" x="625" y="220" width="120" height="44" rx="8"/>
<text class="lbl" x="685" y="242" text-anchor="middle">Reopened</text>
<text class="sub" x="700" y="200">fail</text>

<line x1="625" y1="242" x2="375" y2="242"/>
<line x1="375" y1="242" x2="375" y2="82"/>
<text class="sub" x="500" y="255">back to In Progress</text>

<line x1="70" y1="82" x2="70" y2="260"/>
<rect class="reject" x="20" y="260" width="100" height="44" rx="8"/>
<text class="lbl" x="70" y="282" text-anchor="middle">Rejected</text>
<text class="sub" x="150" y="200">not a real bug —</text>
<text class="sub" x="150" y="213">duplicate, won't fix,</text>
<text class="sub" x="150" y="226">as designed</text>

<text class="sub" x="380" y="315" text-anchor="middle">Rejected is a legitimate outcome, not a failure state — but it still needs a logged reason.</text>
</svg>
