<svg width="740" height="260" viewBox="0 0 740 260" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Appium client-server architecture</title>
<desc>Shows test code as an Appium client sending HTTP commands to an Appium server, which translates them via platform-specific drivers, UIAutomator2 for Android and XCUITest for iOS, into instructions that drive a real device or emulator/simulator.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#9CA3AF" stroke-width="1.5"/></marker></defs>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#E6E6E6;}
.lbl{font-size:12px;font-weight:600;fill:#F5F5F5;}
.sub{font-size:9.5px;fill:#C9C9C9;}
.box{stroke-width:1;}
.client{fill:#241E3D;stroke:#8C7DE0;}
.server{fill:#3A2A10;stroke:#E0A33D;}
.driver{fill:#173829;stroke:#4CAF8C;}
.device{fill:#3A1E1E;stroke:#D97070;}
line{stroke:#9CA3AF;stroke-width:1.3;marker-end:url(#a);}
</style>
<rect x="0" y="0" width="740" height="260" fill="#0D1117"/>

<rect class="box client" x="20" y="90" width="140" height="60" rx="8"/>
<text class="lbl" x="90" y="112" text-anchor="middle">Test Code</text>
<text class="sub" x="90" y="132" text-anchor="middle">(Appium client)</text>

<line x1="160" y1="120" x2="220" y2="120"/>
<text class="sub" x="190" y="108" text-anchor="middle">HTTP</text>

<rect class="box server" x="220" y="90" width="140" height="60" rx="8"/>
<text class="lbl" x="290" y="112" text-anchor="middle">Appium Server</text>
<text class="sub" x="290" y="132" text-anchor="middle">translates commands</text>

<line x1="360" y1="105" x2="430" y2="60"/>
<rect class="box driver" x="430" y="30" width="150" height="50" rx="8"/>
<text class="lbl" x="505" y="50" text-anchor="middle" font-size="11">UIAutomator2</text>
<text class="sub" x="505" y="66" text-anchor="middle">(Android driver)</text>

<line x1="360" y1="135" x2="430" y2="180"/>
<rect class="box driver" x="430" y="155" width="150" height="50" rx="8"/>
<text class="lbl" x="505" y="175" text-anchor="middle" font-size="11">XCUITest</text>
<text class="sub" x="505" y="191" text-anchor="middle">(iOS driver)</text>

<line x1="580" y1="55" x2="630" y2="55"/>
<rect class="box device" x="630" y="30" width="100" height="50" rx="8"/>
<text class="sub" x="680" y="50" text-anchor="middle">Android device</text>
<text class="sub" x="680" y="65" text-anchor="middle">/ emulator</text>

<line x1="580" y1="180" x2="630" y2="180"/>
<rect class="box device" x="630" y="155" width="100" height="50" rx="8"/>
<text class="sub" x="680" y="175" text-anchor="middle">iOS device /</text>
<text class="sub" x="680" y="190" text-anchor="middle">simulator</text>

<text class="sub" x="370" y="230" text-anchor="middle">Client-server, not in-process — a test that "won't even start" is often a server/session</text>
<text class="sub" x="370" y="246" text-anchor="middle">setup problem, not a bug in the test code itself.</text>
</svg>
