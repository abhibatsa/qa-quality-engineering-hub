<svg width="820" height="240" viewBox="0 0 820 240" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Software Testing Life Cycle phases</title>
<desc>Shows the six STLC phases in sequence: Requirement Analysis, Test Planning, Test Case Design, Environment Setup, Test Execution, and Test Closure, each with a one-line description of what happens in that phase.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#9CA3AF" stroke-width="1.5"/></marker></defs>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#E6E6E6;}
.num{font-size:16px;font-weight:700;fill:#F5F5F5;}
.lbl{font-size:11px;font-weight:600;fill:#F5F5F5;}
.sub{font-size:9px;fill:#C9C9C9;}
.box{fill:#241E3D;stroke:#8C7DE0;stroke-width:1;}
line{stroke:#9CA3AF;stroke-width:1.3;marker-end:url(#a);}
</style>
<rect x="0" y="0" width="820" height="240" fill="#0D1117"/>

<g>
<circle cx="60" cy="70" r="22" class="box"/>
<text class="num" x="60" y="70" text-anchor="middle" dominant-baseline="central">1</text>
<text class="lbl" x="60" y="110" text-anchor="middle">Requirement</text>
<text class="lbl" x="60" y="123" text-anchor="middle">Analysis</text>
<text class="sub" x="60" y="145" text-anchor="middle">what's testable,</text>
<text class="sub" x="60" y="157" text-anchor="middle">what's ambiguous</text>
</g>
<line x1="90" y1="70" x2="150" y2="70"/>

<g>
<circle cx="180" cy="70" r="22" class="box"/>
<text class="num" x="180" y="70" text-anchor="middle" dominant-baseline="central">2</text>
<text class="lbl" x="180" y="110" text-anchor="middle">Test</text>
<text class="lbl" x="180" y="123" text-anchor="middle">Planning</text>
<text class="sub" x="180" y="145" text-anchor="middle">scope, approach,</text>
<text class="sub" x="180" y="157" text-anchor="middle">timeline, tools</text>
</g>
<line x1="210" y1="70" x2="270" y2="70"/>

<g>
<circle cx="300" cy="70" r="22" class="box"/>
<text class="num" x="300" y="70" text-anchor="middle" dominant-baseline="central">3</text>
<text class="lbl" x="300" y="110" text-anchor="middle">Test Case</text>
<text class="lbl" x="300" y="123" text-anchor="middle">Design</text>
<text class="sub" x="300" y="145" text-anchor="middle">cases + test</text>
<text class="sub" x="300" y="157" text-anchor="middle">data needs</text>
</g>
<line x1="330" y1="70" x2="390" y2="70"/>

<g>
<circle cx="420" cy="70" r="22" class="box"/>
<text class="num" x="420" y="70" text-anchor="middle" dominant-baseline="central">4</text>
<text class="lbl" x="420" y="110" text-anchor="middle">Environment</text>
<text class="lbl" x="420" y="123" text-anchor="middle">Setup</text>
<text class="sub" x="420" y="145" text-anchor="middle">provisioning,</text>
<text class="sub" x="420" y="157" text-anchor="middle">config matching</text>
</g>
<line x1="450" y1="70" x2="510" y2="70"/>

<g>
<circle cx="540" cy="70" r="22" class="box"/>
<text class="num" x="540" y="70" text-anchor="middle" dominant-baseline="central">5</text>
<text class="lbl" x="540" y="110" text-anchor="middle">Test</text>
<text class="lbl" x="540" y="123" text-anchor="middle">Execution</text>
<text class="sub" x="540" y="145" text-anchor="middle">run, log,</text>
<text class="sub" x="540" y="157" text-anchor="middle">raise defects</text>
</g>
<line x1="570" y1="70" x2="630" y2="70"/>

<g>
<circle cx="660" cy="70" r="22" class="box"/>
<text class="num" x="660" y="70" text-anchor="middle" dominant-baseline="central">6</text>
<text class="lbl" x="660" y="110" text-anchor="middle">Test</text>
<text class="lbl" x="660" y="123" text-anchor="middle">Closure</text>
<text class="sub" x="660" y="145" text-anchor="middle">exit criteria,</text>
<text class="sub" x="660" y="157" text-anchor="middle">lessons learned</text>
</g>

<text class="sub" x="410" y="200" text-anchor="middle" font-size="10">In agile sprints these phases compress and overlap — planning inside sprint planning, execution continuous, closure at the retro.</text>
<text class="sub" x="410" y="216" text-anchor="middle" font-size="10">The phases still all happen — recognizing which one you're implicitly in is what keeps quality from becoming an afterthought.</text>
</svg>
